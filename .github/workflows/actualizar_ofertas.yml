name: Actualizador Nocturno de Gangas

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 12:00 AM hora Colombia (05:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permite probar la ejecución manual si lo desea

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: Ejecutar Extractor Nocturno
      run: |
        python -c "
        from playwright.sync_api import sync_playwright
        import json
        from exito import extraer_exito
        from alkosto import extraer_alkosto
        from ktronix import extraer_ktronix

        todas_ofertas = []
        with sync_playwright() as p:
            browser = p.chromium.launch(headless=True)
            page = browser.new_page()
            
            try:
                todas_ofertas.extend(extraer_exito(page, 'Tecnología', 'https://www.exito.com/tecnologia'))
            except Exception as e: print('Error Exito:', e)
            
            try:
                todas_ofertas.extend(extraer_alkosto(page))
            except Exception as e: print('Error Alkosto:', e)
            
            try:
                todas_ofertas.extend(extraer_ktronix(page))
            except Exception as e: print('Error Ktronix:', e)
            
            browser.close()

        with open('ofertas.json', 'w', encoding='utf-8') as f:
            json.dump(todas_ofertas, f, ensure_ascii=False, indent=2)
        "

    - name: Guardar Cambios en GitHub
      run: |
        git config --global user.name 'Bot Cazador'
        git config --global user.email 'bot@cazadordegangas.com'
        git add ofertas.json
        git commit -m "🤖 Actualización automática de gangas a medianoche" || exit 0
        git push
