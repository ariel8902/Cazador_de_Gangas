name: Actualizador Nocturno de Gangas

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requisitos.txt || pip install -r requirements.txt
        playwright install chromium

    - name: Ejecutar Extractor Nocturno Multitienda
      run: |
        python -c "
        from playwright.sync_api import sync_playwright
        import json, time, random
        from exito import extraer_exito
        from alkosto import extraer_alkosto
        from ktronix import extraer_ktronix

        todas_ofertas = []
        with sync_playwright() as p:
            browser = p.chromium.launch(headless=True)
            context = browser.new_context(
                user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                viewport={'width': 1280, 'height': 720}
            )
            page = context.new_page()
            
            # 1. Éxito
            try:
                print('--- Iniciando Éxito ---')
                of_exito = extraer_exito(page)
                print(f'Éxito aportó: {len(of_exito)} ofertas')
                todas_ofertas.extend(of_exito)
                time.sleep(random.uniform(2.0, 4.0))
            except Exception as e: 
                print('Error crítico en Éxito:', e)
            
            # 2. Alkosto
            try:
                print('--- Iniciando Alkosto ---')
                of_alkosto = extraer_alkosto(page)
                print(f'Alkosto aportó: {len(of_alkosto)} ofertas')
                todas_ofertas.extend(of_alkosto)
                time.sleep(random.uniform(2.0, 4.0))
            except Exception as e: 
                print('Error crítico en Alkosto:', e)
            
            # 3. Ktronix
            try:
                print('--- Iniciando Ktronix ---')
                of_ktronix = extraer_ktronix(page)
                print(f'Ktronix aportó: {len(of_ktronix)} ofertas')
                todas_ofertas.extend(of_ktronix)
            except Exception as e: 
                print('Error crítico en Ktronix:', e)
            
            browser.close()

        print(f'TOTAL GENERAL GUARDADO: {len(todas_ofertas)} ofertas')

        with open('ofertas.json', 'w', encoding='utf-8') as f:
            json.dump(todas_ofertas, f, ensure_ascii=False, indent=2)
        "

    - name: Guardar Cambios en GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add ofertas.json
        git commit -m "🤖 Actualización automática de gangas multitienda" || exit 0
        git push
